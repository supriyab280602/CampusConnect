name: CampusConnect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Lint, Config & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Validate production configuration hardening
        env:
          PYTHONPATH: backend
        run: |
          python -c "from config import validate_production_secret; validate_production_secret('a' * 32, 'production'); print('Config validation OK')"

      - name: Run Ruff critical & modified-files checks
        run: |
          ruff check --select E9,F63,F7,F82 backend/ e2e/
          ruff check backend/app/__init__.py backend/app/utils/rate_limit.py backend/tests/test_app_factory.py backend/tests/test_security_and_edge_cases.py e2e/test_e2e_journeys.py

      - name: Run backend pytest suite
        run: pytest backend/tests -v --tb=short

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  e2e-ci:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend, Playwright, and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt playwright
          playwright install --with-deps chromium
          npm --prefix frontend ci

      - name: Run Playwright E2E suite
        run: pytest e2e/test_e2e_journeys.py -v --tb=short --junitxml=e2e-results.xml

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-report
          path: |
            e2e-results.xml
          if-no-files-found: ignore
