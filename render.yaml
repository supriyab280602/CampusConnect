services:
  - type: web
    name: campusconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/v1/health
    disk:
      name: campusconnect-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/campusconnect.db
      - key: CORS_ORIGINS
        value: https://campusconnect-frontend-bzwf.onrender.com

  - type: web
    name: campusconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusconnect-backend-9o12.onrender.com/api/v1
