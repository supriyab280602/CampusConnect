services:
  - type: web
    name: campusconnect-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/campusconnect.db
      # Update CORS_ORIGINS in the Render Dashboard to your exact Vercel production URL once created
      - key: CORS_ORIGINS
        value: https://campusconnect-frontend-bzwf.onrender.com
